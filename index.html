<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<title>Đăng ký thi đấu - Giải Thể thao Học sinh THPT Thủ Đức</title>
<style>
  :root{
    --navy:#1F4E79;
    --navy-dark:#123047;
    --red:#C0392B;
    --amber:#B8860B;
    --amber-bg:#FCF3DA;
    --green:#1E7B34;
    --green-bg:#E6F4EA;
    --red-bg:#FBEAEA;
    --gray-bg:#F4F5F7;
    --border:#DDE1E6;
    --text:#20262E;
    --text-muted:#6B7280;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0;}
  #app{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:var(--text);
    max-width:760px;
    margin:0 auto;
    padding:1rem 0.5rem 3rem;
  }
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;background:var(--navy);color:#fff;border-radius:12px;
    margin-bottom:1.25rem;
  }
  .topbar .logo{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#fff;object-fit:contain;}
  .topbar .title{font-size:16px;font-weight:600;line-height:1.3;}
  .topbar .sub{font-size:12.5px;opacity:0.85;margin-top:2px;}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:20px;margin-bottom:16px;
  }
  .role-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:560px){.role-grid{grid-template-columns:1fr 1fr 1fr;}}
  .role-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:16px;cursor:pointer;text-align:left;transition:border-color .15s;
  }
  .role-btn:hover{border-color:var(--navy);}
  .role-btn .rname{font-size:15px;font-weight:600;color:var(--navy-dark);}
  .role-btn .rdesc{font-size:12.5px;color:var(--text-muted);line-height:1.4;}
  label{display:block;font-size:13px;font-weight:600;color:var(--text);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  select,input[type=text],input[type=password],textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  select:focus,input:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;}
  textarea{min-height:110px;resize:vertical;line-height:1.5;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 18px;border-radius:8px;border:1px solid var(--navy);
    background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:var(--navy-dark);}
  .btn.secondary{background:#fff;color:var(--navy);border-color:var(--navy);}
  .btn.secondary:hover{background:var(--gray-bg);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn.danger:hover{background:#a53225;}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .err{color:var(--red);font-size:13px;margin-top:6px;}
  .hint{color:var(--text-muted);font-size:12.5px;margin-top:6px;line-height:1.5;}
  .back{background:none;border:none;color:var(--navy);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;font-weight:600;}
  h2{font-size:17px;margin:0 0 4px;color:var(--navy-dark);}
  h3{font-size:14.5px;margin:0 0 10px;color:var(--navy-dark);}
  .muted-line{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}
  .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .badge.pending{background:var(--amber-bg);color:var(--amber);}
  .badge.approved{background:var(--green-bg);color:var(--green);}
  .badge.rejected{background:var(--red-bg);color:var(--red);}
  .mon-item{
    border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;
  }
  .mon-item:hover{border-color:var(--navy);}
  .mon-item.disabled{opacity:0.5;cursor:not-allowed;}
  .mon-item .mname{font-size:14px;font-weight:600;}
  .reg-item{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
  .reg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .reg-head .mname{font-size:14.5px;font-weight:600;}
  .vdv-list{font-size:13px;color:var(--text);white-space:pre-line;line-height:1.6;background:var(--gray-bg);border-radius:8px;padding:8px 10px;margin:8px 0;}
  .meta{font-size:12px;color:var(--text-muted);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:none;}
  .loading{padding:40px;text-align:center;color:var(--text-muted);font-size:14px;}
  .empty{padding:24px;text-align:center;color:var(--text-muted);font-size:13.5px;background:var(--gray-bg);border-radius:10px;}
  .code-cell{font-family:ui-monospace,monospace;font-size:12.5px;}
  .toast{
    position:sticky;top:0;background:var(--green-bg);color:var(--green);
    border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px;
  }
  .toast.error{background:var(--red-bg);color:var(--red);}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .deadline-bar{
    background:#EAF2FB;color:var(--navy);border:1px solid #BFD6EE;
    border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:16px;text-align:center;
  }
  .deadline-bar.closed{background:var(--red-bg);color:var(--red);border-color:#F2C6C1;font-weight:600;}
  .group-heading{
    display:flex;align-items:center;justify-content:space-between;
    margin:18px 0 8px;
  }
  .group-heading:first-child{margin-top:0;}
  .group-heading .gname{font-size:14.5px;font-weight:700;color:var(--navy-dark);}
  .quota-tag{font-size:11.5px;color:var(--text-muted);}
</style>
</head>

window.storage = {
  async get(key, shared) {
    let res;
    try{
      res = await fetch(APPS_SCRIPT_URL, { method: "GET" });
    }catch(networkErr){
      // Lỗi mạng thật sự (mất kết nối, DNS, CORS...) — KHÔNG được hiểu nhầm là "chưa có dữ liệu"
      throw new Error("NETWORK_ERROR");
    }
    if (!res.ok) throw new Error("NETWORK_ERROR"); // lỗi HTTP từ server — cũng là lỗi tạm thời, không phải "trống"
    const text = await res.text();
    if (!text || text === "{}" || text === "null") {
      throw new Error("EMPTY_DATA"); // đây mới thật sự là tín hiệu "chưa có dữ liệu"
    }
    return { key, value: text, shared: !!shared };
  },
};

// QUAN TRỌNG: gọi 1 hành động cụ thể lên Apps Script (submit_reg, decide_reg, add_class, del_class).
// Việc đọc - sửa - ghi được thực hiện HOÀN TOÀN ở phía máy chủ, có khóa (LockService) nên
// không bao giờ bị 2 yêu cầu ghi đè lẫn nhau, dù nhiều người thao tác cùng lúc.
async function callServerAction(action, payload) {
  const url = APPS_SCRIPT_URL + "?token=" + encodeURIComponent(SHEETS_TOKEN);
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action: action }, payload)),
  });
  if (!res.ok) throw new Error("Không lưu được dữ liệu (HTTP " + res.status + ")");
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "Không lưu được dữ liệu");
  return data;
}

  const order = [];
  NOIDUNG.forEach(n=>{ if(!order.includes(n.monGroup)) order.push(n.monGroup); });
  return order.map(g=>({ monGroup:g, items: NOIDUNG.filter(n=>n.monGroup===g) }));
}

function monName(id){ const n = ndInfo(id); return n ? (n.monGroup + " - " + n.ten) : id; }
function statusLabel(s){ return s==="approved" ? "Đã duyệt" : s==="rejected" ? "Đã từ chối" : "Chờ GVCN duyệt"; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    DATA = JSON.parse(res.value);
  }catch(e){
    if(e.message === "EMPTY_DATA"){
      // Trường hợp DUY NHẤT được phép khởi tạo: server xác nhận thật sự chưa có dữ liệu.
      // Việc khởi tạo đi qua action "init_if_empty", được server kiểm tra lại lần nữa
      // trước khi ghi — nên dù trình duyệt hiểu sai, dữ liệu thật vẫn không bị mất.
      try{
        await callServerAction("init_if_empty", { initialClasses: INITIAL_CLASSES });
        const res2 = await window.storage.get(STORAGE_KEY, true);
        DATA = JSON.parse(res2.value);
      }catch(e2){
        DATA = { classes: [], registrations: {} };
        toast = { type:"error", text:"Không kết nối được máy chủ dữ liệu. Vui lòng tải lại trang." };
      }
    }else{
      // Lỗi mạng/máy chủ tạm thời: TUYỆT ĐỐI KHÔNG khởi tạo lại hay ghi bất cứ điều gì lên
      // server. Chỉ báo lỗi và để người dùng tự tải lại trang khi có mạng ổn định.
      DATA = { classes: [], registrations: {} };
      toast = { type:"error", text:"Không tải được dữ liệu (mất kết nối tạm thời). Vui lòng tải lại trang." };
    }
  }
  render();
}

// Tải lại dữ liệu mới nhất từ server (không khởi tạo lại nếu lỗi, giữ nguyên DATA hiện có)
async function refreshData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    DATA = JSON.parse(res.value);
    return true;
  }catch(e){
    return false;
  }
}

function classRegs(classId){
  return (DATA.registrations[classId] || []).slice().sort((a,b)=> b.submittedAt - a.submittedAt);
}

function goHome(){ view="home"; session={}; formErr=""; toast=null; render(); }

function render(){
  const app = document.getElementById("app");
  let html = `<div class="topbar">
    <img class="logo" src="${LOGO_DATA_URI}" alt="Logo kỷ niệm 50 năm thành lập trường">
    <div>
      <div class="title">Đăng ký thi đấu trực tuyến</div>
      <div class="sub">Giải Thể thao Học sinh THPT Thủ Đức - Chào mừng kỷ niệm 50 năm thành lập trường</div>
    </div>
  </div>`;

  html += `<div class="deadline-bar ${isPastDeadline() ? 'closed' : ''}">
    ${isPastDeadline()
      ? `Đã hết hạn đăng ký (hạn chót ${deadlineText()}). Lớp trưởng không thể nộp đăng ký mới.`
      : `Hạn chót đăng ký: hết ngày <strong>${deadlineText()}</strong>`}
  </div>`;

  if(toast){
    html += `<div class="toast ${toast.type==='error'?'error':''}">${esc(toast.text)}</div>`;
  }

  if(view==="home") html += renderHome();
  else if(view==="monitor-login") html += renderMonitorLogin();
  else if(view==="monitor-form") html += renderMonitorForm();
  else if(view==="gvcn-login") html += renderGvcnLogin();
  else if(view==="gvcn-panel") html += renderGvcnPanel();
  else if(view==="admin-login") html += renderAdminLogin();
  else if(view==="admin-panel") html += renderAdminPanel();

  app.innerHTML = html;
  attachHandlers();
}

function findRegForMon(classId, monId){
  const regs = classRegs(classId); // đã sắp xếp mới nhất trước
  return regs.find(r=>r.mon===monId) || null;
}

function renderMonitorForm(){
  const cls = DATA.classes.find(c=>c.id===session.classId);
  const regs = classRegs(cls.id);
  const locked = isPastDeadline();

  const groupsHtml = ndGroups().map(g=>{
    const items = g.items.map(n=>{
      const existing = findRegForMon(cls.id, n.id);
      let label, disabled, extraAttrs = "";
      if(existing){
        if(locked){ label = "Đã đăng ký"; disabled = true; }
        else { label = "Sửa"; disabled = false; extraAttrs = `data-action="pick-mon" data-mon="${n.id}" data-reg="${existing.id}"`; }
      } else {
        if(locked){ label = "Hết hạn"; disabled = true; }
        else { label = "Chọn"; disabled = false; extraAttrs = `data-action="pick-mon" data-mon="${n.id}"`; }
      }
      return `<div class="mon-item ${disabled?'disabled':''}" ${disabled?'':extraAttrs}>
        <div>
          <div class="mname">${esc(n.ten)} ${existing ? `<span class="badge ${existing.status}" style="margin-left:6px;">${statusLabel(existing.status)}</span>` : ""}</div>
          ${n.maxNguoi ? `<span class="quota-tag">${n.exact ? "Đăng ký đúng " + n.maxNguoi + " người" : "Tối đa " + n.maxNguoi + " người"}</span>` : ""}
        </div>
        <div class="meta">${label}</div>
      </div>`;
    }).join("");
    return `<div class="group-heading">
        <span class="gname">${esc(g.monGroup)}</span>
      </div>${items}`;
  }).join("");

  const historyHtml = regs.length ? regs.map(r=>`
    <div class="reg-item">
      <div class="reg-head">
        <div class="mname">${esc(monName(r.mon))}</div>
        <span class="badge ${r.status}">${statusLabel(r.status)}</span>
      </div>
      <div class="vdv-list">${esc(r.vdvList)}</div>
      <div class="meta">Nộp lúc ${new Date(r.submittedAt).toLocaleString("vi-VN")}${r.gvcnNote ? " · Ghi chú GVCN: " + esc(r.gvcnNote) : ""}</div>
      ${!locked ? `<div class="row" style="margin-top:8px;"><button class="btn small secondary" data-action="pick-mon" data-mon="${r.mon}" data-reg="${r.id}">Sửa đăng ký</button></div>` : ""}
    </div>`).join("") : `<div class="empty">Lớp chưa có đăng ký nào.</div>`;

  return `
  <button class="back" data-action="home">&larr; Quay lại</button>
  <div class="card">
    <h2>Lớp ${esc(cls.name)}</h2>
    <p class="muted-line">${locked ? "Đã hết hạn đăng ký, không thể nộp hoặc sửa nội dung nào nữa." : "Chọn một nội dung để nộp đăng ký, hoặc bấm \"Sửa\" trên nội dung đã đăng ký để chỉnh sửa (đăng ký đã duyệt nếu sửa sẽ chuyển về chờ duyệt lại)."}</p>
    ${groupsHtml}
  </div>
  <div class="card">
    <h3>Lịch sử đăng ký của lớp</h3>
    ${historyHtml}
  </div>
  <div id="mon-form-slot"></div>`;
}

function renderMonForm(monId, regId){
  const n = ndInfo(monId);
  let existing = null;
  if(regId){
    existing = classRegs(session.classId).find(r=>r.id===regId) || null;
  }
  const isEdit = !!existing;
  return `
  <div class="card" id="mon-form-card">
    <h3>${isEdit ? "Sửa đăng ký" : "Đăng ký"}: ${esc(n.monGroup)} - ${esc(n.ten)}</h3>
    ${isEdit ? `<p class="hint">Đăng ký hiện đang ở trạng thái "${statusLabel(existing.status)}".${existing.status==="approved" ? " Nếu lưu thay đổi, đăng ký sẽ chuyển về trạng thái \"Chờ GVCN duyệt\" và cần GVCN duyệt lại." : ""}</p>` : ""}
    ${n.maxNguoi ? `<p class="hint">${n.exact ? "Số lượng đăng ký: đúng " + n.maxNguoi + " người." : "Số lượng đăng ký: tối đa " + n.maxNguoi + " người."} ${n.note || ""}</p>` : (n.note ? `<p class="hint">${esc(n.note)}</p>` : "")}
    <label for="mn-vdv">Danh sách vận động viên (mỗi người một dòng, ghi rõ họ tên)</label>
    <textarea id="mn-vdv" placeholder="Nguyễn Văn A&#10;Trần Thị B">${isEdit ? esc(existing.vdvList) : ""}</textarea>
    <label for="mn-submitter">Người nộp đăng ký (lớp trưởng)</label>
    <input type="text" id="mn-submitter" placeholder="Họ tên lớp trưởng" value="${isEdit ? esc(existing.submittedBy || "") : ""}">
    ${formErr ? `<div class="err">${esc(formErr)}</div>` : ""}
    <p class="hint">${isEdit ? "Sau khi lưu, đăng ký sẽ ở trạng thái \"Chờ GVCN duyệt\" (nếu có thay đổi so với trước)." : "Sau khi nộp, đăng ký sẽ ở trạng thái \"Chờ GVCN duyệt\" và chỉ có giá trị khi GVCN đồng ý."}</p>

      <button class="btn" data-action="submit-reg" data-mon="${monId}" ${isEdit ? `data-reg="${existing.id}"` : ""}>${isEdit ? "Lưu thay đổi" : "Nộp đăng ký"}</button>

function renderGvcnPanel(){
  const cls = DATA.classes.find(c=>c.id===session.classId);
  const regs = classRegs(cls.id);
  const pending = regs.filter(r=>r.status==="pending");
  const done = regs.filter(r=>r.status!=="pending");

  const pendingHtml = pending.length ? pending.map(r=>`
    <div class="reg-item">
      <div class="reg-head">
        <div class="mname">${esc(monName(r.mon))}</div>
        <span class="badge pending">${statusLabel(r.status)}</span>
      </div>
      <div class="vdv-list">${esc(r.vdvList)}</div>
      <div class="meta">Người nộp: ${esc(r.submittedBy || "(không ghi)")} · ${new Date(r.submittedAt).toLocaleString("vi-VN")}</div>
      <div class="row" style="margin-top:10px;">
        <button class="btn small" data-action="approve" data-reg="${r.id}">Đồng ý</button>
        <button class="btn small danger" data-action="reject" data-reg="${r.id}">Từ chối</button>
      </div>
    </div>`).join("") : `<div class="empty">Không có đăng ký nào chờ duyệt.</div>`;

  const doneHtml = done.length ? done.map(r=>`
    <div class="reg-item">
      <div class="reg-head">
        <div class="mname">${esc(monName(r.mon))}</div>
        <span class="badge ${r.status}">${statusLabel(r.status)}</span>
      </div>
      <div class="vdv-list">${esc(r.vdvList)}</div>
      <div class="meta">${r.gvcnNote ? "Ghi chú: " + esc(r.gvcnNote) : ""}</div>
    </div>`).join("") : "";

  return `
  <button class="back" data-action="home">&larr; Quay lại</button>
  <div class="card">
    <h2>GVCN lớp ${esc(cls.name)}</h2>
    <p class="muted-line">Duyệt các đăng ký do lớp trưởng nộp. Chỉ đăng ký đã được đồng ý mới có giá trị chính thức.</p>
    <h3 style="margin-top:14px;">Đang chờ duyệt (${pending.length})</h3>
    ${pendingHtml}
  </div>
  ${done.length ? `<div class="card"><h3>Đã xử lý</h3>${doneHtml}</div>` : ""}`;
}

  let allRegs = [];
  DATA.classes.forEach(c=>{
    (DATA.registrations[c.id]||[]).forEach(r=>allRegs.push({...r, className:c.name}));
  });
  allRegs.sort((a,b)=>b.submittedAt-a.submittedAt);
  const approvedCount = allRegs.filter(r=>r.status==="approved").length;
  const pendingCount = allRegs.filter(r=>r.status==="pending").length;

  const regRows = allRegs.length ? allRegs.map(r=>`
    <tr>
      <td>${esc(r.className)}</td>
      <td>${esc(monName(r.mon))}</td>
      <td><span class="badge ${r.status}">${statusLabel(r.status)}</span></td>
      <td class="meta">${new Date(r.submittedAt).toLocaleDateString("vi-VN")}</td>
    </tr>`).join("") : `<tr><td colspan="4" class="empty">Chưa có đăng ký nào.</td></tr>`;

  return `
  <button class="back" data-action="home">&larr; Quay lại</button>
  <div class="card">
    <h2>Bảng điều khiển Tổ GDTC</h2>
    <p class="muted-line">Tổng số đăng ký: ${allRegs.length} · Đã duyệt: ${approvedCount} · Chờ duyệt: ${pendingCount}</p>
  </div>

  <div class="card">
    <h3>Danh sách lớp và mã số</h3>
    <p class="hint" style="margin-bottom:10px;">Mã đăng ký giao cho lớp trưởng, Mã duyệt chỉ giao riêng cho GVCN. Không công khai chung một chỗ.</p>
    <table>
      <tr><th>Lớp</th><th>Mã đăng ký</th><th>Mã duyệt</th><th></th></tr>
      ${classRows}
    </table>
    <div class="divider"></div>
    <h3>Thêm lớp mới</h3>
    <div class="row">
      <input type="text" id="ad-new-name" placeholder="Tên lớp, ví dụ 10A4" style="flex:1;min-width:120px;">
      <input type="text" id="ad-new-reg" placeholder="Mã đăng ký" style="flex:1;min-width:120px;">
      <input type="text" id="ad-new-approve" placeholder="Mã duyệt GVCN" style="flex:1;min-width:120px;">
    </div>
    ${formErr ? `<div class="err">${esc(formErr)}</div>` : ""}
    <div class="row" style="margin-top:10px;">
      <button class="btn" data-action="add-class">Thêm lớp</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3 style="margin:0;">Toàn bộ đăng ký</h3>
      <button class="btn small secondary" data-action="export-xlsx">Xuất Excel (.xlsx)</button>
    </div>
    <table>
      <tr><th>Lớp</th><th>Môn</th><th>Trạng thái</th><th>Ngày nộp</th></tr>
      ${regRows}
    </table>
  </div>`;
}

function attachHandlers(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", onAction);
  });
}

async function onAction(e){
  const el = e.currentTarget;
  const action = el.getAttribute("data-action");
  formErr = "";

  if(action==="home"){ goHome(); return; }

  if(action==="go"){
    view = el.getAttribute("data-view"); render(); return;
  }

  if(action==="monitor-auth"){
    const classId = document.getElementById("mn-class").value;
    const code = document.getElementById("mn-code").value.trim();
    const cls = DATA.classes.find(c=>c.id===classId);
    if(!code){ formErr = "Vui lòng nhập mã đăng ký."; render(); return; }
    if(!cls || cls.regCode !== code){ formErr = "Mã đăng ký không đúng cho lớp đã chọn."; render(); return; }
    await refreshData(); // luôn xem lịch sử đăng ký mới nhất
    session = { classId }; view = "monitor-form"; render(); return;
  }

  if(action==="pick-mon"){
    if(isPastDeadline()){ toast = { type:"error", text:"Đã hết hạn đăng ký (hạn chót " + deadlineText() + ")." }; render(); return; }
    const monId = el.getAttribute("data-mon");
    const regId = el.getAttribute("data-reg") || null;
    document.getElementById("mon-form-slot").innerHTML = renderMonForm(monId, regId);
    document.querySelectorAll("#mon-form-slot [data-action]").forEach(x=>x.addEventListener("click", onAction));
    document.getElementById("mon-form-card").scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  if(action==="cancel-mon"){
    document.getElementById("mon-form-slot").innerHTML = "";
    return;
  }

  if(action==="submit-reg"){
    const monId = el.getAttribute("data-mon");
    const regId = el.getAttribute("data-reg") || null;
    const n = ndInfo(monId);
    const vdvRaw = document.getElementById("mn-vdv").value;
    const submitter = document.getElementById("mn-submitter").value.trim();
    const vdv = vdvRaw.trim();
    const lines = vdvRaw.split("\n").map(s=>s.trim()).filter(Boolean);
    const rerenderMonForm = () => {
      document.getElementById("mon-form-slot").innerHTML = renderMonForm(monId, regId);
      document.querySelectorAll("#mon-form-slot [data-action]").forEach(x=>x.addEventListener("click", onAction));
    };
    if(isPastDeadline()){ formErr = "Đã hết hạn đăng ký (hạn chót " + deadlineText() + ")."; rerenderMonForm(); return; }
    if(!vdv){ formErr = "Vui lòng nhập danh sách vận động viên."; rerenderMonForm(); return; }
    if(n.maxNguoi){
      if(n.exact && lines.length !== n.maxNguoi){ formErr = "Nội dung này yêu cầu đăng ký đúng " + n.maxNguoi + " người (hiện có " + lines.length + " dòng)."; rerenderMonForm(); return; }
      if(!n.exact && lines.length > n.maxNguoi){ formErr = "Nội dung này chỉ được đăng ký tối đa " + n.maxNguoi + " người (hiện có " + lines.length + " dòng)."; rerenderMonForm(); return; }
    }
    el.disabled = true; el.textContent = "Đang lưu...";
    try{
      if(regId){
        await callServerAction("update_reg", { classId: session.classId, regId: regId, vdvList: vdv, submittedBy: submitter });
        toast = { type:"ok", text:"Đã lưu thay đổi. Đăng ký đang ở trạng thái chờ GVCN duyệt." };
      }else{
        await callServerAction("submit_reg", { classId: session.classId, mon: monId, vdvList: vdv, submittedBy: submitter });
        toast = { type:"ok", text:"Đã nộp đăng ký. Đang chờ GVCN duyệt." };
      }
      await refreshData();
    }catch(err){
      toast = { type:"error", text:"Không lưu được dữ liệu. Vui lòng thử lại." };
    }
    render();
    return;
  }

  if(action==="gvcn-auth"){
    const classId = document.getElementById("gv-class").value;
    const code = document.getElementById("gv-code").value.trim();
    const cls = DATA.classes.find(c=>c.id===classId);
    if(!code){ formErr = "Vui lòng nhập mã duyệt."; render(); return; }
    if(!cls || cls.approveCode !== code){ formErr = "Mã duyệt không đúng cho lớp đã chọn."; render(); return; }
    await refreshData(); // luôn xem danh sách chờ duyệt mới nhất
    session = { classId }; view = "gvcn-panel"; render(); return;
  }

  if(action==="approve" || action==="reject"){
    const regId = el.getAttribute("data-reg");
    let noteToSave = "";
    if(action==="reject"){
      noteToSave = prompt("Ghi chú lý do từ chối (có thể để trống):") || "";
    }
    el.disabled = true;
    try{
      await callServerAction("decide_reg", { classId: session.classId, regId: regId, decision: action==="approve"?"approved":"rejected", note: noteToSave });
      await refreshData();
      toast = { type:"ok", text: action==="approve" ? "Đã duyệt đăng ký." : "Đã từ chối đăng ký." };
    }catch(err){
      toast = { type:"error", text:"Không lưu được dữ liệu. Vui lòng thử lại." };
    }
    render();
    return;
  }

  if(action==="admin-auth"){
    const code = document.getElementById("ad-code").value.trim();
    if(code !== ADMIN_CODE){ formErr = "Mã quản trị không đúng."; render(); return; }
    await refreshData(); // luôn xem toàn bộ đăng ký mới nhất
    view = "admin-panel"; render(); return;
  }

  if(action==="add-class"){
    const name = document.getElementById("ad-new-name").value.trim();
    const reg = document.getElementById("ad-new-reg").value.trim();
    const approve = document.getElementById("ad-new-approve").value.trim();
    if(!name || !reg || !approve){ formErr = "Vui lòng nhập đủ tên lớp, mã đăng ký và mã duyệt."; render(); return; }
    if(reg === approve){ formErr = "Mã đăng ký và mã duyệt phải khác nhau."; render(); return; }
    if(DATA.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){ formErr = "Lớp này đã tồn tại."; render(); return; }
    try{
      await callServerAction("add_class", { name: name, regCode: reg, approveCode: approve });
      await refreshData();
      toast = { type:"ok", text:"Đã thêm lớp " + name + "." };
    }catch(err){
      formErr = err.message || "Không thêm được lớp. Vui lòng thử lại.";
    }
    render();
    return;
  }

  if(action==="export-xlsx"){
    if(typeof XLSX === "undefined"){
      toast = { type:"error", text:"Chưa tải được thư viện xuất Excel (cần có mạng), vui lòng thử lại sau ít giây." };
      render();
      return;
    }
    await refreshData(); // đảm bảo xuất đúng dữ liệu mới nhất
    const rows = [["Khối","Lớp","Môn","Nội dung","Trạng thái","Số VĐV","Danh sách vận động viên","Người nộp","Ngày nộp","Ngày GVCN xử lý","Ghi chú GVCN"]];
    DATA.classes.forEach(c=>{
      const khoi = (c.name.match(/^\d+/) || ["?"])[0];
      (DATA.registrations[c.id]||[]).forEach(r=>{
        const n = ndInfo(r.mon);
        const count = r.vdvList.split("\n").map(s=>s.trim()).filter(Boolean).length;
        rows.push([
          "Khối " + khoi, c.name, n ? n.monGroup : "", n ? n.ten : "",
          statusLabel(r.status), count,
          r.vdvList.replace(/\n/g,"; "), r.submittedBy || "",
          new Date(r.submittedAt).toLocaleString("vi-VN"),
          r.decidedAt ? new Date(r.decidedAt).toLocaleString("vi-VN") : "",
          r.gvcnNote || ""
        ]);
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [
      { wch: 9 }, { wch: 8 }, { wch: 15 }, { wch: 24 }, { wch: 15 },
      { wch: 8 }, { wch: 36 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 26 }
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dang ky");
    XLSX.writeFile(wb, "TongHopDangKy_HoiThiTDTT_ThuDuc.xlsx");
    toast = { type:"ok", text:"Đã xuất file Excel (.xlsx) — mở giống nhau trên cả Excel và Numbers." };
    render();
    return;
  }

  if(action==="del-class"){
    const id = el.getAttribute("data-id");
    const cls = DATA.classes.find(c=>c.id===id);
    if(cls && confirm("Xóa lớp " + cls.name + "? Toàn bộ đăng ký của lớp cũng sẽ bị xóa.")){
      try{
        await callServerAction("del_class", { classId: id });
        await refreshData();
        toast = { type:"ok", text:"Đã xóa lớp " + cls.name + "." };
      }catch(err){
        toast = { type:"error", text:"Không xóa được lớp. Vui lòng thử lại." };
      }
      render();
    }
    return;
  }
}

loadData();
</script>
